<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="description" content="Gestion de production, de stocks et de ventes de poulets de chair." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Volaille chez TALL" />
    <link rel="icon" href="./icons/volaille-chez-tall-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/volaille-chez-tall-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Volaille chez TALL — Gestion avicole</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigation principale">
        <a class="brand" href="#dashboard" aria-label="Volaille chez TALL, accueil">
          <img class="brand-mark" src="./icons/volaille-chez-tall-logo.png" alt="" />
          <span class="brand-copy"><strong>Volaille chez TALL</strong><small>Gestion avicole</small></span>
        </a>
        <div class="nav-caption">EXPLOITATION</div>
        <nav class="nav-list" id="main-nav" role="tablist" aria-label="Sections de l’exploitation">
          <button class="nav-item active" id="tab-dashboard" role="tab" aria-selected="true" aria-controls="page-container" tabindex="0" data-page="dashboard"><span class="nav-icon" data-icon="dashboard"></span><span>Vue d’ensemble</span></button>
          <button class="nav-item" id="tab-bands" role="tab" aria-selected="false" aria-controls="page-container" tabindex="-1" data-page="bands"><span class="nav-icon" data-icon="bands"></span><span>Bandes</span><span class="nav-count" id="band-count">0</span></button>
          <button class="nav-item" id="tab-daily" role="tab" aria-selected="false" aria-controls="page-container" tabindex="-1" data-page="daily"><span class="nav-icon" data-icon="daily"></span><span>Suivi quotidien</span></button>

          <button class="nav-item" id="tab-sales" role="tab" aria-selected="false" aria-controls="page-container" tabindex="-1" data-page="sales"><span class="nav-icon" data-icon="sales"></span><span>Ventes</span></button>
          <button class="nav-item" id="tab-expenses" role="tab" aria-selected="false" aria-controls="page-container" tabindex="-1" data-page="expenses"><span class="nav-icon" data-icon="expenses"></span><span>Charges</span></button>
          <button class="nav-item" id="tab-annual" role="tab" aria-selected="false" aria-controls="page-container" tabindex="-1" data-page="annual"><span class="nav-icon" data-icon="stats"></span><span>Statistiques annuelles</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="offline-card">
            <span class="offline-dot"></span>
            <div><strong id="connection-label">Mode hors ligne prêt</strong><small id="sync-label">Données sur cet appareil</small></div>
          </div>
          <button class="profile-button" id="settings-button">
            <span class="avatar">PP</span>
            <span><strong>Mon exploitation</strong><small>Paramètres & synchronisation</small></span>
            <span class="profile-chevron">···</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Exploitation</span><span class="breadcrumb-slash">/</span><strong id="page-title">Vue d’ensemble</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button sync-button" id="sync-button" aria-label="Synchroniser les données" title="Synchroniser">
              <span data-icon="sync"></span><span class="sync-text">Synchroniser</span><span class="pending-badge" id="pending-count">0</span>
            </button>
            <button class="icon-button settings-shortcut" data-action="settings" aria-label="Ouvrir les paramètres" title="Paramètres"><span data-icon="settings"></span><span class="settings-text">Paramètres</span></button>

          </div>
        </header>
        <div class="page-container" id="page-container" role="tabpanel" aria-labelledby="tab-dashboard" tabindex="0" aria-live="polite"></div>
      </main>
    </div>

    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
